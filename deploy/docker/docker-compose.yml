# Hạ tầng cho dịch vụ AI nội bộ (chạy CPU): Ollama (vision LLM + embedding) và Qdrant (vector store).
# ai-service (Python FastAPI) gọi Ollama để nhận diện ảnh và Qdrant để tra tri thức.
#
#   docker compose -f deploy/docker/docker-compose.yml up -d
name: smart-ops-engine

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    networks: [soe-net]

  ai-service:
    build: ../../apps/ai-service
    environment:
      AI_OLLAMA_URL: http://ollama:11434
      AI_QDRANT_URL: http://qdrant:6333
      AI_API_KEY: ${AI_API_KEY:-}
    ports:
      - "8001:8001"
    volumes:
      - ../../data:/data
    depends_on: [ollama, qdrant]
    restart: unless-stopped
    networks: [soe-net]

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped
    networks: [soe-net]

networks:
  soe-net:
    driver: bridge

volumes:
  ollama-data:
  qdrant-data:
