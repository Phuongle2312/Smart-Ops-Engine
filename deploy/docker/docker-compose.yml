# Môi trường phát triển M1: SQL Server + Identity + Gateway.
# Các service còn lại (Inventory, Monitoring, Metrics, Incident, Notification, Realtime, Audit)
# sẽ được bổ sung ở M2–M4 theo docs/01_architecture/deployment_scaling.md.
#
#   docker compose -f deploy/docker/docker-compose.yml up -d --build
name: smart-ops-engine

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Thiếu biến SQL_SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [soe-net]

  identity:
    build:
      context: ../../apps/backend-v3
      dockerfile: src/Services/Identity/SOE.Identity.Api/Dockerfile
    image: soe/identity:${TAG:-dev}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=soe_identity;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      Jwt__Issuer: soe-identity
      Jwt__Audience: soe-api
      Jwt__KeyId: soe-key-1
      Jwt__PrivateKeyPem: ${JWT_PRIVATE_KEY_PEM:-}
      Identity__MigrateOnStartup: "true"
      Identity__InitialAdminPassword: ${INITIAL_ADMIN_PASSWORD:-}
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped
    networks: [soe-net]

  gateway:
    build:
      context: ../../apps/backend-v3
      dockerfile: src/Gateway/SOE.Gateway/Dockerfile
    image: soe/gateway:${TAG:-dev}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__Authority: http://identity:8080
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:-http://localhost:5173}
      ReverseProxy__Clusters__identity__Destinations__identity-1__Address: http://identity:8080/
    ports:
      - "8080:8080"
    depends_on:
      - identity
    restart: unless-stopped
    networks: [soe-net]

networks:
  soe-net:
    driver: bridge

volumes:
  mssql-data:
