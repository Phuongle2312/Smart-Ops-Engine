# ============================================================
# Smart Ops Engine — application.properties
# ============================================================

# Server
server.port=8080

# ============================================================
# Database — SQL Server
# ============================================================
# Credential đọc từ biến môi trường (xem apps/legacy-v1/.env.example) — KHÔNG hardcode giá trị thật ở đây.
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:smart_ops_engine};encrypt=true;trustServerCertificate=true;
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ============================================================
# Email — SMTP relay nội bộ (Exchange tập đoàn / mạng LAN không internet)
# ============================================================
# Kịch bản A (mặc định): relay nội bộ không cần auth, port 25 — IT whitelist theo IP máy backend.
# Kịch bản B: Exchange yêu cầu domain account, port 587 + STARTTLS — set SMTP_AUTH=true và SMTP_USERNAME/SMTP_PASSWORD.
# Ưu tiên set SMTP_HOST bằng IP tĩnh nếu backend chưa chắc chắn resolve được DNS nội bộ.
spring.mail.host=${SMTP_HOST:mail.tapdoan.local}
spring.mail.port=${SMTP_PORT:25}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ============================================================
# Smart Ops Engine — Custom config
# ============================================================

# Email nhận cảnh báo sự cố — chỉ dùng làm giá trị seed lần chạy đầu tiên.
# Sau khi khởi động, giá trị thật đọc/ghi qua bảng system_config (trang "Cấu hình hệ thống" trên web),
# nên KHÔNG bắt buộc set env var này để app khởi động được.
smartops.alert.recipient.email=${ALERT_RECIPIENT_EMAIL:}

# Tên hệ thống hiển thị trong email alert
smartops.system-name=Smart Ops Engine v1.0

# AES key để mã hóa/giải mã mật khẩu SSH của Node — bắt buộc set qua biến môi trường
smartops.aes.secret-key=${AES_SECRET_KEY}

# Tần suất health check — 300000ms = 5 phút
smartops.scheduler.disk-check-interval-ms=300000

# Lịch báo cáo sáng: 8:00 AM thứ 2 đến thứ 6
smartops.scheduler.daily-report-cron=0 0 8 * * MON-FRI

# Ngưỡng cảnh báo (%)
smartops.threshold.disk-warning=80
smartops.threshold.disk-critical=90
smartops.threshold.cpu-critical=85
smartops.threshold.memory-critical=90

# ============================================================
# SSH — timeout (tăng cho môi trường route xuyên VLAN, nhiều hop hơn LAN phẳng)
# ============================================================
smartops.ssh.connect-timeout-ms=${SSH_CONNECT_TIMEOUT_MS:15000}
smartops.ssh.command-timeout-ms=${SSH_COMMAND_TIMEOUT_MS:40000}
