# ============================================================
# Smart Ops Engine — application-dev.properties (H2 In-Memory DB)
# Chạy với profile dev: .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=dev
# ============================================================

server.port=8080

# Database — H2 In-Memory
spring.datasource.url=jdbc:h2:mem:smart_ops_engine;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MSSQLServer
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# application.properties ép SQLServerDialect (sinh COUNT_BIG mà H2 không có) — ghi đè lại cho profile dev
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Dev secret key mặc định (AES-256 32 ký tự)
smartops.aes.secret-key=${AES_SECRET_KEY:12345678901234567890123456789012}
